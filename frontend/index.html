<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Timber student publication workspace — an interactive showcase of equipment inventory, borrowing, returns, and incident reviews."
    />
    <meta name="theme-color" content="#153F32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Timber · Inventory Management</title>
    <script>
      try {
        const theme = localStorage.getItem('timber_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <p style="padding: 2rem; font-family: system-ui">Loading the inventory workspace…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
